name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout including engine submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager 'platforms;android-37' 'cmake;3.22.1' 'ndk;28.2.13676358'

      - name: Build debug APK
        working-directory: engine/DroidVM
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: win11-android-emulator-debug
          path: engine/DroidVM/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
