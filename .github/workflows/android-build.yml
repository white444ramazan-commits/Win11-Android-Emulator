name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout including engine submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's current hosted images already include Android command-line tools.
      # Avoid setup-android@v3: it requests the removed legacy SDK package "tools".
      - name: Install Android build components (license pipe hardened)
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          # sdkmanager closes the pipe after accepting its prompts; without
          # disabling pipefail, yes exits with SIGPIPE and incorrectly fails the job.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install 'platforms;android-36' 'cmake;3.22.1' 'ndk;28.2.13676358'

      - name: Build debug APK
        working-directory: engine/DroidVM
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: win11-android-emulator-debug
          path: engine/DroidVM/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
